name: Build and push images

# Magento is compiled inside the app image (di:compile + static content), which
# needs far more CPU and RAM than the 2-core node this is deployed to. Building
# here and pulling a finished image keeps the target box out of that business —
# and produces linux/amd64 images regardless of the developer's laptop arch.

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  MAGENTO_VERSION: 2.4.7-p3

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: magento-app
            context: docker/magento-app
          - name: magento-nginx
            context: docker/magento-nginx

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercased owner: ghcr.io rejects tags containing uppercase characters,
      # and github.repository_owner preserves whatever case the account uses.
      - name: Compute image name
        id: img
        run: echo "repo=${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.repo }}:${{ env.MAGENTO_VERSION }}
            ${{ steps.img.outputs.repo }}:latest
          # Persist the layer cache in the registry so a docs-only change does
          # not re-run the ~15 minute Composer install and DI compile.
          cache-from: type=registry,ref=${{ steps.img.outputs.repo }}:buildcache
          cache-to: type=registry,ref=${{ steps.img.outputs.repo }}:buildcache,mode=max
