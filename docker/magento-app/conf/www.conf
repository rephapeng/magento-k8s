; PHP-FPM pool for Magento. Sizing rationale (see docs/production-design.md):
; each worker peaks ~80-100MB, so pm.max_children=16 fits the 2Gi memory limit
; with headroom. Tune here and rebuild the image, or mount this as a ConfigMap
; in production to change it without a rebuild.
[www]
user = magento
group = magento
listen = 9000

pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Keep environment (DB creds, Redis, etc.) available to PHP workers.
clear_env = no

; Surface worker stdout/stderr to container logs.
catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2

; Health/status endpoints (used by tooling, not exposed publicly).
pm.status_path = /status
ping.path = /ping
