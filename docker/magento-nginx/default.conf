# Magento 2 Nginx vhost (adapted from Magento's official nginx.conf.sample).
# PHP-FPM runs in a sibling container reachable at 127.0.0.1:9000.

upstream fastcgi_backend {
    server 127.0.0.1:9000;
}

# PHP only treats $_SERVER['HTTPS'] as "off" when it is empty or the literal
# "off" — ANY other value, including the string "http", counts as on. Passing
# X-Forwarded-Proto through verbatim therefore makes Magento think a plain HTTP
# request was secure and bounce it to the https base URL. Map it explicitly so
# only a real "https" turns the flag on.
map $http_x_forwarded_proto $fastcgi_https_flag {
    default "";
    https   on;
}

server {
    listen 8080;
    server_name _;

    set $MAGE_ROOT /var/www/html;
    set $MAGE_MODE production;

    root $MAGE_ROOT/pub;
    index index.php;
    autoindex off;
    charset UTF-8;
    client_max_body_size 64M;

    # Lightweight liveness/readiness endpoint - never touches PHP.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Deny access to sensitive locations.
    location ~* ^/(app|vendor|generated|var|setup/index|update|dev|lib|phpserver)/ {
        deny all;
    }

    location /media/ {
        try_files $uri $uri/ /get.php$is_args$args;
        location ~ ^/media/theme_customization/.*\.xml$ { deny all; }
        add_header X-Frame-Options "SAMEORIGIN";
    }

    location /static/ {
        # In production, static files are pre-deployed; fall back to static.php
        # only if a file is missing (e.g. first request after a deploy).
        location ~ ^/static/version\d*/ {
            rewrite ^/static/version\d*/(.*)$ /static/$1 last;
        }
        try_files $uri $uri/ /static.php$is_args$args;
        add_header Cache-Control "public";
        expires +1y;
    }

    location /opt/ {
        try_files $uri $uri/ /get.php$is_args$args;
    }

    # Front controller.
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Only these PHP entry points may be executed.
    location ~ ^/(index|get|static|errors/report|errors/404|errors/503|health_check)\.php$ {
        try_files $uri =404;
        fastcgi_pass fastcgi_backend;
        # fastcgi_buffers sizes the BODY buffers; the response *headers* must fit
        # in a single fastcgi_buffer_size buffer, and Magento's redirects carry
        # enough Set-Cookie data to blow past the 4k/8k default -> nginx answers
        # 502 with "upstream sent too big header".
        fastcgi_buffer_size 32k;
        fastcgi_buffers 1024 4k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_param  PHP_FLAG  "session.auto_start=off \n mail.add_x_header=off";
        fastcgi_param  PHP_VALUE "memory_limit=2048M \n max_execution_time=1800";
        fastcgi_read_timeout 600s;
        fastcgi_connect_timeout 600s;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param MAGE_MODE $MAGE_MODE;
        # Cloudflare terminates TLS; the ingress forwards the original scheme.
        fastcgi_param HTTPS $fastcgi_https_flag if_not_empty;
        include fastcgi_params;
    }

    # Block direct execution of any other PHP file.
    location ~* \.php$ {
        deny all;
    }

    gzip on;
    gzip_disable "msie6";
    gzip_comp_level 6;
    gzip_min_length 1100;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
