{{- if .Values.cloudflared.enabled }}
# Cloudflare Tunnel = the public exposure mechanism (requirement 3.3). It makes
# an OUTBOUND-only connection to Cloudflare's edge, so NO inbound port, router
# port-forward, or public IP is required, and the data tier is never exposed.
#
# Public traffic path:
#   Browser --HTTPS--> Cloudflare edge --tunnel--> cloudflared pod
#           --> ingress-nginx Service --> Ingress --> magento-web --> php-fpm
#
# The tunnel TOKEN is supplied at deploy time via the cloudflare-tunnel Secret
# (created by deploy.sh from .env) and is NEVER committed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  labels: {{- include "magento.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.cloudflared.replicaCount }}   # >1 for HA of the tunnel
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "magento.name" . }}
      component: cloudflared
  template:
    metadata:
      labels:
        {{- include "magento.labels" . | nindent 8 }}
        component: cloudflared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: cloudflared
          image: {{ .Values.cloudflared.image | quote }}
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-tunnel
                  key: token
          ports:
            - { name: metrics, containerPort: 2000 }
          livenessProbe:
            httpGet: { path: /ready, port: 2000 }
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /ready, port: 2000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{- toYaml .Values.cloudflared.resources | nindent 12 }}
{{- end }}
