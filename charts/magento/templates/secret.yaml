# All sensitive material lives here and is injected at deploy time from .env
# (see deploy.sh). Defaults are empty and the chart REFUSES to render without
# them, guaranteeing no credential is ever hardcoded in Git.
{{- $db := required "secrets.dbPassword is required (set via .env / --set)" .Values.secrets.dbPassword -}}
{{- $dbRoot := required "secrets.dbRootPassword is required" .Values.secrets.dbRootPassword -}}
{{- $adminPw := required "secrets.adminPassword is required" .Values.secrets.adminPassword -}}
{{- $cryptKey := required "secrets.cryptKey is required (stable Magento crypt key)" .Values.secrets.cryptKey }}
apiVersion: v1
kind: Secret
metadata:
  name: magento-secret
  labels: {{- include "magento.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ $db | quote }}
  DB_ROOT_PASSWORD: {{ $dbRoot | quote }}
  MAGENTO_ADMIN_PASSWORD: {{ $adminPw | quote }}
  # Stable encryption key so multi-replica pods and reinstalls stay consistent.
  MAGENTO_CRYPT_KEY: {{ $cryptKey | quote }}
{{- if .Values.secrets.marketplacePublicKey }}
  # Adobe Commerce Marketplace auth keys (used only at image BUILD time, kept
  # here for reference / composer inside cluster if ever needed).
  COMPOSER_AUTH: {{ printf "{\"http-basic\":{\"repo.magento.com\":{\"username\":\"%s\",\"password\":\"%s\"}}}" .Values.secrets.marketplacePublicKey .Values.secrets.marketplacePrivateKey | quote }}
{{- end }}
{{- if and .Values.cloudflared.enabled .Values.secrets.cloudflareTunnelToken }}
---
# Cloudflare Tunnel token, consumed by the cloudflared Deployment. Kept in the
# cluster only; supplied from .env at deploy time, never committed.
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-tunnel
  labels: {{- include "magento.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.secrets.cloudflareTunnelToken | quote }}
{{- end }}
