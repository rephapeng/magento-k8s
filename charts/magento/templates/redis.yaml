{{- if .Values.redis.enabled }}
# Redis for Magento cache + full-page cache + session storage.
# Ephemeral by design: cache/session are reconstructible, so no PVC. This also
# makes multi-replica Magento safe (shared session store).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "magento.redisHost" . }}
  labels: {{- include "magento.labels" . | nindent 4 }}
spec:
  clusterIP: None          # internal only
  selector:
    app.kubernetes.io/name: {{ include "magento.name" . }}
    component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "magento.redisHost" . }}
  labels: {{- include "magento.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "magento.name" . }}
      component: redis
  template:
    metadata:
      labels:
        {{- include "magento.labels" . | nindent 8 }}
        component: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          args: ["redis-server", "--maxmemory", "384mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
{{- end }}
