# =============================================================================
# Overlay for a SMALL node — 2 vCPU / 4 GB RAM
#   minikube start --cpus=2 --memory=3000mb --driver=docker
#   minikube addons enable ingress
#   helm ... -f values.yaml -f values-minikube.yaml -f values-minikube-small.yaml
# =============================================================================
# The default values target a comfortable dev box and request ~1.6 vCPU /
# ~4.4 GiB, which does not fit here at all: the memory requests alone exceed the
# machine's RAM, so pods never leave Pending.
#
# These numbers are not guesses trimmed until the scheduler stopped complaining.
# They come from `kubectl top` on a working deployment, with headroom added:
#
#   component     measured idle    request    limit
#   opensearch    ~600 MiB*        640Mi      896Mi
#   php-fpm       191 MiB          512Mi      896Mi
#   mariadb       208 MiB          256Mi      512Mi
#   cron          48 MiB           128Mi      384Mi
#   nginx         ~10 MiB          32Mi       64Mi
#   redis         14 MiB           32Mi       128Mi
#   * measured at 976 MiB on a 512m heap; halving the heap roughly halves it.
#
# Steady state: 700m / 1600Mi. Peak, while the one-shot install Job runs
# alongside everything else: 950m / 2240Mi — which is what has to fit under the
# node's allocatable, alongside ~450Mi of kube-system and ingress-nginx.
#
# Trade-offs, stated plainly:
#   - 4 PHP-FPM workers => ~4 concurrent PHP requests. Fine for a demo, not load.
#   - A 256 MB OpenSearch heap is below Elastic's comfort zone. A small catalogue
#     indexes fine; a real one will GC-thrash.
#   - The limits are close to the requests, so a genuine traffic spike gets the
#     pod OOM-killed rather than the node swapping itself to death. On a box this
#     size that is the better failure mode, but it is a deliberate choice.
#   - Expect the first install to take considerably longer than on 4+ cores.

global:
  storageClass: "standard"

magento:
  replicaCount: 1
  resources:
    requests: { cpu: "300m", memory: "512Mi" }
    limits:   { memory: "896Mi" }
  nginxResources:
    requests: { cpu: "25m", memory: "32Mi" }
    limits:   { memory: "64Mi" }
  # 4 workers x ~150 MiB peak each is what the 896Mi limit above has to cover.
  phpFpm:
    pm: dynamic
    maxChildren: 4
    startServers: 2
    minSpareServers: 1
    maxSpareServers: 2

mariadb:
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { memory: "512Mi" }

opensearch:
  javaOpts: "-Xms256m -Xmx256m"
  resources:
    requests: { cpu: "200m", memory: "640Mi" }
    limits:   { memory: "896Mi" }

redis:
  resources:
    requests: { cpu: "50m", memory: "32Mi" }
    limits:   { memory: "128Mi" }

cron:
  resources:
    requests: { cpu: "50m", memory: "128Mi" }
    limits:   { memory: "384Mi" }

# The one-shot installer is the peak consumer and runs while everything else is
# already up, so its request is what decides whether the deploy fits.
install:
  resources:
    requests: { cpu: "250m", memory: "640Mi" }
    limits:   { memory: "896Mi" }

# One tunnel replica: a second is pointless on a single-node cluster.
cloudflared:
  replicaCount: 1
  resources:
    requests: { cpu: "25m", memory: "32Mi" }
    limits:   { memory: "64Mi" }

# Nothing to scale onto on a single 2-core node.
hpa:
  enabled: false

# A PDB with one replica only blocks drains on a single-node cluster.
pdb:
  enabled: false

networkPolicy:
  enabled: false
